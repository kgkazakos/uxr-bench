[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uxr-bench"
version = "0.1.0"
description = "Benchmark dataset and evaluation harness for LLM performance on qualitative UX research tasks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kostas Gkazakos", email = "kostas@example.com" }]
keywords = ["uxr", "llm", "benchmark", "evaluation", "product-research", "qualitative-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "litellm>=1.30",
]

[project.scripts]
uxr-bench = "uxr_bench.cli:cli"

[project.urls]
Homepage = "https://github.com/kgkazakos/uxr-bench"
Repository = "https://github.com/kgkazakos/uxr-bench"
Issues = "https://github.com/kgkazakos/uxr-bench/issues"

[tool.setuptools.packages.find]
include = ["uxr_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["uxr_bench"]
omit = ["tests/*", "examples/*"]
